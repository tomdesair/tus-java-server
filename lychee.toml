# Lychee link checker configuration, see https://lychee.cli.rs/
# Also verify that #anchors exist in the linked Markdown files
include_fragments = true

# Treat rate limiting as success; retry transient failures
accept = ["200..=299", "429"]
max_retries = 2
timeout = 20

# Local examples and placeholders that are not meant to resolve
exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://upload\.example\.com',
  '^https?://example\.com',
]
